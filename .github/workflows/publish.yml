name: Publicar no npm

# Publica o @gamelo/sdk quando uma tag vX.Y.Z é enviada. A versão da tag precisa ser a
# mesma do packages/sdk/package.json. Precisa do segredo NPM_TOKEN (token de automação do npm
# com acesso à organização gamelo).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Confere a versão
        run: |
          pkg=$(node -p "require('./packages/sdk/package.json').version")
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $pkg do packages/sdk/package.json"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publica
        working-directory: packages/sdk
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' packages/sdk/CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
